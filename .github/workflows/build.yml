name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"
  ANDROID_NDK_VERSION: "r26d"

jobs:
  # ── 1. Build tun2proxy for Android arm64 ─────────────────────────────────
  build-tun2proxy:
    name: Build tun2proxy (arm64-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-${{ env.ANDROID_NDK_VERSION }}-linux.zip" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=/opt/android-ndk-${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Clone tun2proxy
        run: git clone --depth 1 https://github.com/tun2proxy/tun2proxy.git /tmp/tun2proxy

      - name: Build tun2proxy for aarch64-linux-android
        run: |
          export CC="${TOOLCHAIN}/bin/aarch64-linux-android33-clang"
          export AR="${TOOLCHAIN}/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${CC}"
          cd /tmp/tun2proxy
          cargo build --release --target aarch64-linux-android 2>&1

          # tun2proxy project may produce tun2proxy-bin or tun2proxy depending on version
          # Find whichever binary was built and copy it
          TARGET_DIR="target/aarch64-linux-android/release"
          BIN=""
          for candidate in tun2proxy-bin tun2proxy; do
            if [ -f "${TARGET_DIR}/${candidate}" ]; then
              BIN="${TARGET_DIR}/${candidate}"
              echo "Found binary: ${BIN}"
              break
            fi
          done

          if [ -z "${BIN}" ]; then
            echo "ERROR: No tun2proxy binary found. Contents of release dir:"
            ls -la "${TARGET_DIR}/" | grep -v '\.d$' | head -20
            # Try finding any non-debug ELF
            BIN=$(find "${TARGET_DIR}" -maxdepth 1 -type f ! -name '*.d' ! -name '*.rlib' \
              -executable 2>/dev/null | head -1)
            echo "Fallback binary: ${BIN}"
          fi

          if [ -z "${BIN}" ]; then
            echo "FATAL: could not find tun2proxy binary"
            exit 1
          fi

          cp "${BIN}" "${{ github.workspace }}/third_party/tun2proxy/tun2proxy"
          chmod +x "${{ github.workspace }}/third_party/tun2proxy/tun2proxy"
          file "${{ github.workspace }}/third_party/tun2proxy/tun2proxy"
          ls -lh "${{ github.workspace }}/third_party/tun2proxy/tun2proxy"

      - name: Upload tun2proxy artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun2proxy-arm64
          path: third_party/tun2proxy/tun2proxy

  # ── 2. Build Go daemon for Android arm64 ─────────────────────────────────
  build-daemon:
    name: Build sshcustomd (arm64-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: daemon/go.sum

      - name: Set VERSION
        run: |
          if [ -f VERSION ]; then
            echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Build daemon
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../module/bin
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${{ env.VERSION }}" \
            -o ../module/bin/sshcustomd \
            ./cmd/sshcustomd/
        working-directory: daemon

      - name: Verify daemon binary
        run: |
          file module/bin/sshcustomd
          ls -lh module/bin/sshcustomd
          # Should be ELF 64-bit ARM aarch64
          file module/bin/sshcustomd | grep -q "aarch64" && echo "✓ arm64 verified" || (echo "WRONG ARCH"; exit 1)

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshcustomd-arm64
          path: module/bin/sshcustomd

  # ── 3. Package Magisk module ZIP ─────────────────────────────────────────
  package-module:
    name: Package Magisk module ZIP
    runs-on: ubuntu-latest
    needs: [build-tun2proxy, build-daemon]
    steps:
      - uses: actions/checkout@v4

      - name: Set VERSION
        run: |
          if [ -f VERSION ]; then
            echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Download daemon
        uses: actions/download-artifact@v4
        with:
          name: sshcustomd-arm64
          path: module/bin/

      - name: Download tun2proxy
        uses: actions/download-artifact@v4
        with:
          name: tun2proxy-arm64
          path: module/bin/

      - name: Set binary permissions
        run: |
          chmod +x module/bin/sshcustomd module/bin/tun2proxy
          ls -lh module/bin/

      - name: Stamp module.prop version
        run: |
          VERSION="${{ env.VERSION }}"
          sed -i "s|^version=.*|version=v${VERSION}|" module/module.prop
          # versionCode: strip dots, append 00
          VC="$(echo "${VERSION}" | tr -d '.' | sed 's/[^0-9]//g')00"
          sed -i "s|^versionCode=.*|versionCode=${VC}|" module/module.prop
          cat module/module.prop

      - name: Package ZIP
        run: |
          mkdir -p dist
          cd module
          zip -r9 "../dist/SSHCustom-VPNChain-v${{ env.VERSION }}.zip" . \
            -x "*.DS_Store" -x "__MACOSX/*" \
            -x "bin/.gitkeep" -x "vpnchain/configs/.gitkeep"
          ls -lh "../dist/SSHCustom-VPNChain-v${{ env.VERSION }}.zip"

      - name: Upload module ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/SSHCustom-VPNChain-v${{ env.VERSION }}.zip

  # ── 4. Build Android APK ─────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;35.0.0" 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: app

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: app
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Locate and stage APK
        run: |
          echo "Searching for APK in $GITHUB_WORKSPACE..."
          find "$GITHUB_WORKSPACE" -name "*debug*.apk" -type f 2>/dev/null
          APK=$(find "$GITHUB_WORKSPACE" -name "*debug*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK found"
            exit 1
          fi
          echo "Found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/SSHCustom-VPNChain-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/SSHCustom-VPNChain-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: SSHCustom-VPNChain-debug.apk

  # ── 5. Create GitHub Release (on version tags only) ───────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package-module, build-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set VERSION from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download module ZIP
        uses: actions/download-artifact@v4
        with:
          name: module-zip
          path: dist/

      - name: Download APK (optional — release proceeds even if APK build failed)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-apk
          path: dist/

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SSHCustom-VPNChain ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            dist/*.zip
            dist/*.apk
          body: |
            ## SSHCustom-VPNChain ${{ github.ref_name }}

            ### Installation
            1. Flash `SSHCustom-VPNChain-v${{ env.VERSION }}.zip` via Magisk / KernelSU / APatch
            2. Reboot
            3. Install `SSHCustom-VPNChain-debug.apk`
            4. Open app → grant root in KSU → configure SSH credentials → **Start**

            ### Included in ZIP
            | File | Description |
            |---|---|
            | `bin/sshcustomd` | Go daemon (ARM64, static, 6-7MB) |
            | `bin/tun2proxy` | TUN proxy binary (tun/tun_udpgw modes) |
            | `scripts/ssh.service` | Lifecycle manager |
            | `scripts/ssh.iptables` | All 4 traffic modes + capability probe |
            | `scripts/ssh.tool` | BBR, TCP buffers, cgroup helpers |
            | `settings.ini` | Master config — edit SSH credentials here |

            ### Requirements
            - Android 9+ (`arm64-v8a`)
            - Magisk v20.4+, KernelSU, or APatch

            ### Traffic modes
            `redirect` (default) · `tproxy` · `tun` · `tun_udpgw`
