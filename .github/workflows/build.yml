name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"
  ANDROID_NDK_VERSION: "r26d"
  RUST_TARGET: "aarch64-linux-android"

jobs:
  # ── 1. Build tun2proxy for Android arm64 ─────────────────────────────────
  build-tun2proxy:
    name: Build tun2proxy (arm64-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-${{ env.ANDROID_NDK_VERSION }}-linux.zip" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=/opt/android-ndk-${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Clone tun2proxy
        run: git clone --depth 1 https://github.com/tun2proxy/tun2proxy.git /tmp/tun2proxy

      - name: Build tun2proxy for aarch64-linux-android
        run: |
          export CC="${TOOLCHAIN}/bin/aarch64-linux-android33-clang"
          export AR="${TOOLCHAIN}/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${CC}"
          cd /tmp/tun2proxy
          cargo build --release --target aarch64-linux-android 2>&1
          cp target/aarch64-linux-android/release/tun2proxy-bin \
             "${{ github.workspace }}/third_party/tun2proxy/tun2proxy"
          ls -lh "${{ github.workspace }}/third_party/tun2proxy/tun2proxy"

      - name: Upload tun2proxy artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun2proxy-arm64
          path: third_party/tun2proxy/tun2proxy

  # ── 2. Build Go daemon for Android arm64 ─────────────────────────────────
  build-daemon:
    name: Build sshcustomd (arm64-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: daemon/go.sum

      - name: Set VERSION
        run: |
          if [ -f VERSION ]; then
            echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Build daemon
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../module/bin
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${{ env.VERSION }}" \
            -o ../module/bin/sshcustomd \
            ./cmd/sshcustomd/
        working-directory: daemon

      - name: Verify binary
        run: |
          file module/bin/sshcustomd
          ls -lh module/bin/sshcustomd

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshcustomd-arm64
          path: module/bin/sshcustomd

  # ── 3. Package Magisk module ZIP ─────────────────────────────────────────
  package-module:
    name: Package Magisk module ZIP
    runs-on: ubuntu-latest
    needs: [build-tun2proxy, build-daemon]
    steps:
      - uses: actions/checkout@v4

      - name: Set VERSION
        run: |
          if [ -f VERSION ]; then
            echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Download daemon
        uses: actions/download-artifact@v4
        with:
          name: sshcustomd-arm64
          path: module/bin/

      - name: Download tun2proxy
        uses: actions/download-artifact@v4
        with:
          name: tun2proxy-arm64
          path: module/bin/

      - name: Set binary permissions
        run: |
          chmod +x module/bin/sshcustomd
          chmod +x module/bin/tun2proxy

      - name: Stamp module.prop version
        run: |
          sed -i "s|^version=.*|version=v${{ env.VERSION }}|" module/module.prop
          sed -i "s|^versionCode=.*|versionCode=$(echo '${{ env.VERSION }}' | tr -d '.' | sed 's/^//')00|" module/module.prop
          cat module/module.prop

      - name: Package ZIP
        run: |
          mkdir -p dist
          cd module
          zip -r9 "../dist/SSHCustom-VPNChain-v${{ env.VERSION }}.zip" . \
            -x "*.DS_Store" -x "__MACOSX/*" -x "bin/.gitkeep" -x "vpnchain/configs/.gitkeep"
          ls -lh "../dist/SSHCustom-VPNChain-v${{ env.VERSION }}.zip"

      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/SSHCustom-VPNChain-v${{ env.VERSION }}.zip

  # ── 4. Build Android APK ─────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: app

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: app
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Find and rename APK
        run: |
          find /home/runner/work/sshcustom-vpnchain -name "app-debug.apk" 2>/dev/null | head -5
          APK=$(find /home/runner/work/sshcustom-vpnchain -name "app-debug.apk" -type f 2>/dev/null | head -1)
          echo "Found APK at: $APK"
          cp "$APK" SSHCustom-VPNChain-v2.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: SSHCustom-VPNChain-v2.0.0-debug.apk

  # ── 5. Create GitHub Release (on version tags only) ───────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package-module, build-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    # Continue even if build-apk failed — release the ZIP regardless
    continue-on-error: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set VERSION from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download module ZIP
        uses: actions/download-artifact@v4
        with:
          name: module-zip
          path: dist/

      - name: Download APK (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-debug-apk
          path: dist/

      - name: List release assets
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SSHCustom-VPNChain ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          fail_on_unmatched_files: false
          files: |
            dist/*.zip
            dist/*.apk
          body: |
            ## SSHCustom-VPNChain ${{ github.ref_name }}

            ### Installation
            1. Flash `SSHCustom-VPNChain-v${{ env.VERSION }}.zip` via Magisk / KernelSU / APatch
            2. Install `SSHCustom-v${{ github.ref_name }}-debug.apk` companion app
            3. Reboot → open app → configure SSH credentials → **Start**

            ### What's in the ZIP
            - `sshcustomd` — Go daemon (ARM64, static, no deps)
            - `ssh.service` / `ssh.iptables` / `ssh.tool` — module scripts
            - `settings.ini` — master config template
            - `customize.sh` — Magisk/KSU/APatch installer

            ### Requirements
            - Rooted Android 9+ (arm64-v8a)
            - Magisk v20.4+, KernelSU, or APatch

            ### Changes
            See [docs/architecture-analysis.md](https://github.com/GoodyOG/sshcustom-vpnchain/blob/main/docs/architecture-analysis.md)
