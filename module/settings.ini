#!/system/bin/sh
# SSHCustom-VPNChain Settings
# ════════════════════════════════════════════════════════
# Do NOT edit while service is running.
# All changes take effect on next start/restart.
# ════════════════════════════════════════════════════════

# ── Bootstrap: ensure busybox is available ────────────────
if ! command -v busybox >/dev/null 2>&1; then
  export PATH="/data/adb/magisk:/data/adb/ksu/bin:/data/adb/ap/bin:$PATH:/system/bin"
fi

# ── Paths (do not modify) ─────────────────────────────────
box_dir="/data/adb/sshcustom"
box_run="${box_dir}/run"
box_log="${box_run}/sshcustom.log"
box_pid="${box_run}/sshcustom.pid"
bin_dir="${box_dir}/bin"
box_run_state="${box_run}/state"

mkdir -p "${box_run}" "${box_run_state}" >/dev/null 2>&1 || true

# ── SSH Connection ─────────────────────────────────────────
ssh_host=""
ssh_port="22"
ssh_user=""
ssh_password=""

# SSH transport mode: direct | sni | sni_http_proxy
ssh_mode="direct"

# SNI hostname — carrier bypass technique (sni / sni_http_proxy modes)
ssh_sni_host=""

# HTTP proxy settings (sni_http_proxy mode only)
http_proxy_host=""
http_proxy_port="3128"

# Payload injection (all modes)
# Paste raw payload string — variables: [host] [port] [cr] [lf] [crlf]
payload_enabled="false"
payload=""

# ── Traffic Interception ───────────────────────────────────
# network_mode: redirect | tproxy | tun | tun_udpgw
network_mode="redirect"

# Local proxy ports
socks_port="1080"
tproxy_port="9898"
redir_port="9797"

# TUN device name (tun / tun_udpgw modes)
tun_device="tun0"

# UDP gateway server host:port on VPS (tun_udpgw mode only)
# Example: udpgw_server="127.0.0.1:7300"
udpgw_server=""

# ── Proxy Behaviour ───────────────────────────────────────
proxy_tcp="true"
proxy_udp="false"

# QUIC: disable = block UDP 443/80 OUTPUT (forces TCP fallback through tunnel)
#        enable  = allow QUIC (may break on SSH-only setups)
quic="disable"

# ── DNS ───────────────────────────────────────────────────
# DNS hijack intercepts port-53 traffic and resolves through the tunnel
dns_hijack_tcp="true"
dns_hijack_udp="false"

# dns_hijack_mode: redirect | tproxy | disable
dns_hijack_mode="redirect"

# ── Speed Boost ───────────────────────────────────────────
# Pre-warm SSH channel pool (eliminates per-connection negotiation latency)
channel_pool="true"
channel_pool_size="8"

# BBR congestion control (requires kernel support)
bbr_enabled="true"

# TCP buffer tuning (maximise throughput for high-latency SSH)
tcp_buffer_tuning="true"

# ── IPv6 ──────────────────────────────────────────────────
# false = disable IPv6 system-wide while tunnel is active (recommended)
ipv6="false"

# ── Performance (cgroup) ──────────────────────────────────
cgroup_blkio="true"
blkio_weight="900"

# ── Module metadata ───────────────────────────────────────
# Path stamped into module.prop by ssh.service
module_prop="/data/adb/modules/sshcustom-vpnchain/module.prop"

# ── Logging ───────────────────────────────────────────────
# Shared log() function — used by all scripts
# Levels: Info | Warning | Error | Debug
current_time="$(date '+%H:%M')"

log() {
  local level="$1"
  shift
  local msg="${current_time} [${level}]: $*"
  # Print to terminal if interactive, otherwise append to log
  if [ -t 1 ]; then
    printf '%s\n' "${msg}"
  else
    printf '%s\n' "${msg}" >> "${box_log}"
  fi
}
